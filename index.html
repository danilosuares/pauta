<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f4f7">
  <meta name="description" content="Meus aplicativos e projetos digitais.">
  <title>appsp · meus apps</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;color:#172338;background:#f1f4f7;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% -22%,#fff 0,#f6f8fa 40%,#eaf0f5 100%)}
    .topbar{height:68px;padding:0 clamp(20px,5vw,76px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffffa8;background:#ffffff52;backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:10px;color:#27364a;text-decoration:none;font-size:18px;font-weight:700;letter-spacing:-.5px}.brand-mark{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#546f96,#314b70);color:white;font-size:16px;box-shadow:0 4px 12px #304b7028}.top-note{color:#718097;font-size:13px}
    main{width:min(920px,calc(100% - 36px));margin:0 auto;padding:clamp(50px,10vh,105px) 0 56px}.intro{text-align:center;margin-bottom:48px}.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#70829b}.intro h1{margin:12px 0 10px;font-size:clamp(34px,6vw,52px);line-height:1.08;letter-spacing:-2.5px;font-weight:650;color:#1d2a3e}.intro p{margin:0;color:#728096;font-size:16px;line-height:1.6}
    .device{position:relative;margin:auto;width:min(770px,100%);min-height:325px;padding:42px clamp(22px,7vw,72px) 36px;border:1px solid #ffffffd9;border-radius:30px;background:linear-gradient(135deg,#ffffffa6,#f9fbfd73);box-shadow:0 28px 80px #32476312,inset 0 1px #fff;backdrop-filter:blur(22px)}.device-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;color:#8794a6;font-size:12px}.device-head strong{font-weight:600;color:#65758b}.date{display:flex;gap:7px;align-items:center}.status{display:flex;align-items:center;gap:6px}.status-dot{height:7px;width:7px;border-radius:50%;background:#71b28f;box-shadow:0 0 0 3px #71b28f20}
    .apps{display:grid;grid-template-columns:repeat(4,minmax(80px,1fr));justify-items:center;gap:30px 20px}.app{display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;color:#344157;text-decoration:none;font-size:13px;font-weight:550;transition:transform .18s ease}.app:hover{transform:translateY(-4px)}.app:focus-visible{outline:3px solid #7c9bc3;outline-offset:7px;border-radius:18px}.icon{width:76px;height:76px;border-radius:21px;display:grid;place-items:center;box-shadow:0 9px 20px #253a5520,inset 0 1px #ffffffaa;transition:box-shadow .18s ease}.app:hover .icon{box-shadow:0 13px 26px #253a5530,inset 0 1px #ffffffaa}.icon.pauta{background:linear-gradient(145deg,#e8f3e5,#bed5bf)}.icon.linkedin{background:linear-gradient(145deg,#258bc3,#0866a8)}.icon svg{width:43px;height:43px}.icon.linkedin svg{width:34px;height:34px}
    .helper{text-align:center;color:#94a0af;font-size:12px;margin:27px 0 0}.footer{padding:0 20px 28px;text-align:center;color:#98a3b1;font-size:12px}
    @media(max-width:560px){.topbar{height:58px}.top-note{font-size:12px}.intro{margin-bottom:34px}.intro p{font-size:14px}.device{min-height:300px;padding:30px 18px;border-radius:24px}.device-head{margin-bottom:28px}.apps{grid-template-columns:repeat(3,minmax(68px,1fr));gap:28px 8px}.icon{width:68px;height:68px;border-radius:19px}.app{font-size:12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="appsp início"><span class="brand-mark">a</span><span>appsp</span></a>
    <span class="top-note">um espaço para minhas ideias</span>
  </header>
  <main id="inicio">
    <section class="intro" aria-labelledby="title">
      <div class="eyebrow">meu espaço digital</div>
      <h1 id="title">Tudo no seu lugar.</h1>
      <p>Meus aplicativos e projetos, em um só lugar.</p>
    </section>
    <section class="device" aria-label="Aplicativos">
      <div class="device-head">
        <span class="date"><strong id="weekday"></strong><span id="today"></span></span>
        <span class="status"><i class="status-dot"></i> tudo certo</span>
      </div>
      <nav class="apps" aria-label="Meus aplicativos">
        <a class="app" href="./pauta/" aria-label="Abrir Pauta">
          <span class="icon pauta" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none"><rect x="8" y="7" width="32" height="34" rx="9" fill="#2B634B"/><path d="M18 16h11.2a6 6 0 0 1 0 12H18V16Z" fill="#F5F8E9"/><path d="M18 16v18" stroke="#D8EE91" stroke-width="3.5" stroke-linecap="round"/><circle cx="32.5" cy="34" r="2" fill="#D8EE91"/></svg>
          </span>
          <span>Pauta</span>
        </a>
        <a class="app" href="https://www.linkedin.com/in/danilosuares/" target="_blank" rel="noopener noreferrer" aria-label="Abrir LinkedIn de Danilo em uma nova aba">
          <span class="icon linkedin" aria-hidden="true">
            <svg viewBox="0 0 36 36" fill="none"><path d="M8.2 13.7h5.1v14.1H8.2V13.7Zm2.6-7a3 3 0 1 1-.1 6 3 3 0 0 1 .1-6ZM16.5 13.7h4.9v1.9h.1c.7-1.3 2.4-2.6 4.9-2.6 5.2 0 6.2 3.4 6.2 7.8v7h-5.1v-6.2c0-1.5 0-3.5-2.2-3.5s-2.6 1.7-2.6 3.4v6.3h-5.1V13.7Z" fill="white"/></svg>
          </span>
          <span>LinkedIn</span>
        </a>
      </nav>
      <p class="helper">Mais aplicativos vão aparecer aqui.</p>
    </section>
  </main>
  <footer class="footer">Feito com cuidado · appsp</footer>
  <script>
    const now = new Date();
    document.querySelector('#weekday').textContent = new Intl.DateTimeFormat('pt-BR', {weekday:'long'}).replace(/^./, c => c.toUpperCase());
    document.querySelector('#today').textContent = new Intl.DateTimeFormat('pt-BR', {day:'numeric', month:'long'}).format(now);
  </script>
</body>
</html>
